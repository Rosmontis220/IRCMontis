[workspace]
members = ["src-tauri", "crates/irc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
ircmontis-irc = { path = "crates/irc" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "1.0"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }

tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-build = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-background-service = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true