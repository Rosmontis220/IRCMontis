name: Release

# Triggered by pushing a version tag (e.g. v0.1.0).
# Builds and signs desktop artifacts, then creates a GitHub Release with the
# generated assets, checksums and updater manifest.
# Android release builds are intentionally not part of v1 (no signing keystore yet).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Pre-flight: verify tag format and extract version
  # ---------------------------------------------------------------------------
  version:
    name: Extract version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release for ${TAG} (version ${VERSION})"

  # ---------------------------------------------------------------------------
  # Windows — MSI + NSIS installer
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (x86_64)
    needs: [version]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Ensure changelog entry
        run: pnpm app:changelog -- --version "${{ needs.version.outputs.version }}" --write

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build release installer
        run: cargo tauri build --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage portable exe
        shell: bash
        run: |
          mkdir -p target/release/bundle/portable
          cp target/release/ircmontis.exe \
            "target/release/bundle/portable/IRCMontis_${{ needs.version.outputs.version }}_x64-portable.exe"

      - name: Validate release security mitigations
        run: >-
          python scripts/validate-release-security.py
          --frontend-dist build
          --windows-binary target/release/ircmontis.exe

      - name: EV Code Sign
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) {
            Write-Host "::warning::WINDOWS_CERTIFICATE secret not set — skipping signing"
            exit 0
          }

          $certPath = "${{ runner.temp }}\codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_B64))

          $bundleDir = "target\release\bundle"

          Get-ChildItem -Path $bundleDir -Filter "*.msi" -Recurse | ForEach-Object {
            signtool sign /fd SHA256 /f "$certPath" /p "$env:CERT_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 /v $_.FullName
          }

          Get-ChildItem -Path $bundleDir -Filter "*.exe" -Recurse | ForEach-Object {
            signtool sign /fd SHA256 /f "$certPath" /p "$env:CERT_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 /v $_.FullName
          }

          Remove-Item $certPath -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/portable/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux — AppImage + deb + rpm
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (x86_64)
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Ensure changelog entry
        run: pnpm app:changelog -- --version "${{ needs.version.outputs.version }}" --write

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build release packages
        run: cargo tauri build --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Validate release frontend security
        run: python scripts/validate-release-security.py --frontend-dist build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage*
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs:
      - version
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Prepare release notes
        run: |
          pnpm app:release-notes -- \
            --version "${{ needs.version.outputs.version }}" \
            --tag "${{ needs.version.outputs.tag }}" \
            --repository "${{ github.repository }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out-dir release-metadata

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Normalize artifact file names
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts")
          for path in sorted(root.rglob("*"), key=lambda item: len(item.parts), reverse=True):
              if not path.is_file() or " " not in path.name:
                  continue

              target = path.with_name(path.name.replace(" ", "_"))
              if target.exists():
                  raise SystemExit(f"Cannot normalize {path}: {target} already exists")

              path.rename(target)
          PY

      - name: Generate checksums
        run: |
          cd artifacts

          find . -type f \( \
            -name '*.msi' \
            -o -name '*.exe' \
            -o -name '*.sig' \
            -o -name '*.dmg' \
            -o -name '*.AppImage*' \
            -o -name '*.deb' \
            -o -name '*.rpm' \
            -o -name '*.app.tar.gz' \
          \) -exec sha256sum {} \; > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Generate Tauri updater manifest
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          NOTES_PATH: release-metadata/updater-notes.md
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          root = Path("artifacts")
          repo = os.environ["REPOSITORY"]
          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          notes_path = Path(os.environ["NOTES_PATH"])
          notes = notes_path.read_text(encoding="utf-8").strip() if notes_path.exists() else f"IRCMontis {version}"

          def first(pattern: str):
              return next(root.rglob(pattern), None)

          def github_asset_name(path: Path) -> str:
              return path.name.replace(" ", "_")

          def asset_url(path: Path) -> str:
              return f"https://github.com/{repo}/releases/download/{tag}/{quote(github_asset_name(path))}"

          def signature_for(path: Path) -> str | None:
              sig = Path(f"{path}.sig")
              if sig.exists():
                  return sig.read_text(encoding="utf-8").strip()
              return None

          def add_platform(platforms: dict, key: str, path: Path | None):
              if path is None:
                  return

              signature = signature_for(path)
              if not signature:
                  return

              platforms[key] = {
                  "signature": signature,
                  "url": asset_url(path),
              }

          platforms = {}

          windows_nsis = first("*-setup.exe")
          windows_msi = first("*.msi")
          windows = windows_nsis or windows_msi
          linux = first("*.AppImage")

          add_platform(platforms, "windows-x86_64-nsis", windows_nsis)
          add_platform(platforms, "windows-x86_64-msi", windows_msi)
          add_platform(platforms, "windows-x86_64", windows)
          add_platform(platforms, "linux-x86_64", linux)

          if not platforms:
              raise SystemExit("No signed updater artifacts found")

          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }

          (root / "latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Debug generated files
        run: |
          echo "After manifest generation:"
          find artifacts -type f -print
          test -f artifacts/latest.json && cat artifacts/latest.json || echo "latest.json NOT FOUND"
          echo "Release notes:"
          cat release-metadata/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: IRCMontis ${{ needs.version.outputs.version }}
          body_path: release-metadata/release-notes.md
          files: |
            artifacts/release-windows-x86_64/**/*
            artifacts/release-linux-x86_64/**/*
            artifacts/SHA256SUMS.txt
            artifacts/latest.json
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: false